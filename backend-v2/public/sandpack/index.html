<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>Drape Sandpack Preview</title>
    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
        background: #0b0b0c;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #888;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="loading">Caricamento Sandpack…</div>
    </div>

    <!-- React + ReactDOM + Sandpack via ESM CDN -->
    <script type="module">
      import React from 'https://esm.sh/react@18.3.1';
      import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
      import { Sandpack } from 'https://esm.sh/@codesandbox/sandpack-react@2.20.0?deps=react@18.3.1,react-dom@18.3.1';

      const SDK_VERSION = '1.0.0';

      function postToHost(type, payload) {
        try {
          window.ReactNativeWebView?.postMessage(JSON.stringify({ type, payload }));
          window.parent !== window && window.parent.postMessage({ source: 'drape-sandpack', type, payload }, '*');
        } catch {}
      }

      function App() {
        const [files, setFiles] = React.useState({
          '/App.js': {
            code: `export default function App() {
  return <div style={{padding:24, fontFamily:'system-ui'}}>
    <h1>Drape Preview</h1>
    <p>In attesa dei file del progetto…</p>
  </div>;
}`,
          },
        });
        const [appwrite, setAppwrite] = React.useState(null);
        const [theme, setTheme] = React.useState('dark');
        const [template, setTemplate] = React.useState('react');

        React.useEffect(() => {
          function onMessage(event) {
            const data = typeof event.data === 'string' ? safeParse(event.data) : event.data;
            if (!data || data.source && data.source !== 'drape-host') return;
            switch (data.type) {
              case 'set_files':
                setFiles(data.payload?.files ?? files);
                break;
              case 'set_appwrite':
                setAppwrite(data.payload ?? null);
                break;
              case 'set_template':
                if (data.payload?.template) setTemplate(data.payload.template);
                break;
              case 'set_theme':
                if (data.payload?.theme) setTheme(data.payload.theme);
                break;
              case 'ping':
                postToHost('pong', { sdk: SDK_VERSION });
                break;
            }
          }
          window.addEventListener('message', onMessage);
          // Notify host that bridge is ready
          postToHost('ready', { sdk: SDK_VERSION });
          return () => window.removeEventListener('message', onMessage);
        }, []);

        // Inject Appwrite credentials as Vite env vars (visibili nel codice user)
        const customSetup = React.useMemo(() => {
          if (!appwrite) return undefined;
          return {
            entry: '/index.js',
            dependencies: { appwrite: 'latest' },
          };
        }, [appwrite]);

        const filesWithEnv = React.useMemo(() => {
          if (!appwrite) return files;
          // Inietta un file env-shim caricato all'avvio dell'app
          const envShim = {
            '/env.js': {
              code: `// Auto-generated by Drape — Appwrite credentials\nwindow.VITE_APPWRITE_ENDPOINT = '${appwrite.endpoint}';\nwindow.VITE_APPWRITE_PROJECT_ID = '${appwrite.projectId}';\nwindow.VITE_APPWRITE_DATABASE_ID = '${appwrite.databaseId}';\n`,
              hidden: false,
            },
          };
          return { ...envShim, ...files };
        }, [files, appwrite]);

        return React.createElement(Sandpack, {
          template,
          theme,
          files: filesWithEnv,
          customSetup,
          options: {
            showLineNumbers: true,
            showInlineErrors: true,
            wrapContent: true,
            editorHeight: '100%',
            editorWidthPercentage: 0,
          },
        });
      }

      function safeParse(s) {
        try { return JSON.parse(s); } catch { return null; }
      }

      createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
  </body>
</html>
