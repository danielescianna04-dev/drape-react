<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dashboard - Manage your items with full CRUD operations powered by SQLite." />
  <meta name="theme-color" content="#030712" />
  <title>Dashboard - Cloud Mode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Dashboard-specific styles */
    .dashboard-section {
      padding-top: 7rem;
      padding-bottom: 4rem;
      min-height: 100vh;
    }
    .dashboard-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .dashboard-title-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }
    .dashboard-title-row h1 {
      font-size: 1.875rem;
      font-weight: 700;
      color: white;
      margin: 0;
    }
    .item-count-badge {
      padding: 0.25rem 0.75rem;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: 9999px;
      background: rgba(139, 92, 246, 0.1);
      color: var(--purple-400);
      border: 1px solid rgba(139, 92, 246, 0.2);
    }
    .dashboard-subtitle {
      color: #94a3b8;
      font-size: 0.9375rem;
      margin: 0;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      padding: 1rem;
      border-radius: 0.75rem;
    }
    .stat-card .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0;
    }
    .stat-card .stat-value.green { color: #4ade80; }
    .stat-card .stat-value.blue { color: #60a5fa; }
    .stat-card .stat-label {
      font-size: 0.875rem;
      color: #94a3b8;
    }
    .items-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }
    .item-card {
      padding: 1.25rem;
      border-radius: 0.75rem;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .item-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(139, 92, 246, 0.3);
      transform: translateY(-2px);
    }
    .item-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .item-card-header h3 {
      font-size: 1.125rem;
      font-weight: 600;
      color: white;
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 0.3s;
    }
    .item-card:hover .item-card-header h3 {
      color: var(--purple-400);
    }
    .status-badge {
      flex-shrink: 0;
      padding: 0.25rem 0.625rem;
      font-size: 0.75rem;
      font-weight: 500;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid;
    }
    .status-badge.active {
      background: rgba(34, 197, 94, 0.1);
      color: #4ade80;
      border-color: rgba(34, 197, 94, 0.2);
    }
    .status-badge.active:hover { background: rgba(34, 197, 94, 0.2); }
    .status-badge.completed {
      background: rgba(59, 130, 246, 0.1);
      color: #60a5fa;
      border-color: rgba(59, 130, 246, 0.2);
    }
    .status-badge.completed:hover { background: rgba(59, 130, 246, 0.2); }
    .item-description {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 1rem;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-height: 1.5;
    }
    .item-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .item-date {
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .item-actions {
      display: flex;
      gap: 0.25rem;
    }
    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.375rem;
      border-radius: 0.5rem;
      color: #94a3b8;
      transition: all 0.2s;
      background: none;
      border: none;
      cursor: pointer;
    }
    .icon-btn:hover {
      color: white;
      background: rgba(255, 255, 255, 0.1);
    }
    .icon-btn.delete:hover {
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
    }
    .icon-btn svg { width: 16px; height: 16px; }
    .empty-state {
      padding: 3rem;
      border-radius: 1rem;
      text-align: center;
    }
    .empty-state .emoji { font-size: 2.5rem; margin-bottom: 1rem; }
    .empty-state h3 {
      font-size: 1.125rem;
      font-weight: 600;
      color: white;
      margin-bottom: 0.5rem;
    }
    .empty-state p {
      color: #94a3b8;
      margin-bottom: 1.5rem;
    }
    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
    }
    .modal-content {
      position: relative;
      width: 100%;
      max-width: 28rem;
      padding: 1.5rem;
      border-radius: 1rem;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .modal-header h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: white;
      margin: 0;
    }
    .modal-error {
      display: none;
      margin-bottom: 1rem;
      padding: 0.75rem;
      border-radius: 0.75rem;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #f87171;
      font-size: 0.875rem;
    }
    .modal-error.show { display: block; }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 0.375rem;
    }
    .form-input,
    .form-textarea,
    .form-select {
      width: 100%;
      padding: 0.625rem 1rem;
      border-radius: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      font-family: inherit;
      font-size: 0.9375rem;
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .form-input::placeholder,
    .form-textarea::placeholder {
      color: rgba(148, 163, 184, 0.5);
    }
    .form-input:focus,
    .form-textarea:focus,
    .form-select:focus {
      border-color: rgba(139, 92, 246, 0.5);
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.15);
    }
    .form-textarea { resize: none; }
    .form-select option {
      background: #1e293b;
      color: white;
    }
    .modal-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    .modal-actions button {
      flex: 1;
      padding: 0.75rem;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 0.9375rem;
      cursor: pointer;
      transition: all 0.3s;
      text-align: center;
    }
    .btn-cancel {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
    }
    .btn-cancel:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .btn-submit {
      background: linear-gradient(135deg, var(--purple-600), var(--indigo-600));
      border: none;
      color: white;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, var(--purple-500), var(--indigo-500));
    }
    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    @media (max-width: 1024px) {
      .items-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .items-grid { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: 1fr; }
      .dashboard-header { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="container">
      <a href="index.html" class="nav-logo" aria-label="Home">
        <div class="nav-logo-icon">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <span>Acme</span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="dashboard.html" class="nav-link active">Dashboard</a>
      </div>
      <div class="nav-actions">
        <a href="#" class="nav-sign-in">Sign in</a>
        <a href="#" class="btn-primary">Get Started</a>
      </div>
      <button class="mobile-toggle" aria-label="Toggle menu" aria-expanded="false">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
  </nav>

  <!-- Dashboard Section -->
  <section class="dashboard-section">
    <div class="container">
      <!-- Header -->
      <div class="dashboard-header">
        <div>
          <div class="dashboard-title-row">
            <h1>Dashboard</h1>
            <span class="item-count-badge" id="item-count-badge">0 items</span>
          </div>
          <p class="dashboard-subtitle">Manage your items with full CRUD operations powered by SQLite.</p>
        </div>
        <button class="btn-primary btn-large" id="btn-add" onclick="openModal()">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width:20px;height:20px">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
          </svg>
          Add Item
        </button>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card glass">
          <div class="stat-value" id="stat-total" style="color: white">0</div>
          <div class="stat-label">Total Items</div>
        </div>
        <div class="stat-card glass">
          <div class="stat-value green" id="stat-active">0</div>
          <div class="stat-label">Active</div>
        </div>
        <div class="stat-card glass">
          <div class="stat-value blue" id="stat-completed">0</div>
          <div class="stat-label">Completed</div>
        </div>
      </div>

      <!-- Items Grid -->
      <div class="items-grid" id="items-grid"></div>

      <!-- Empty State -->
      <div class="empty-state glass" id="empty-state" style="display:none">
        <div class="emoji">&#128466;</div>
        <h3>No items yet</h3>
        <p>Create your first item to get started.</p>
        <button class="btn-primary btn-large" onclick="openModal()">Create First Item</button>
      </div>
    </div>
  </section>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal-backdrop" onclick="closeModal()"></div>
    <div class="modal-content glass">
      <div class="modal-header">
        <h2 id="modal-title">New Item</h2>
        <button class="icon-btn" onclick="closeModal()">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="modal-error" id="modal-error"></div>
      <form id="item-form" onsubmit="handleSubmit(event)">
        <input type="hidden" id="form-id" />
        <div class="form-group">
          <label for="form-title">Title</label>
          <input class="form-input" type="text" id="form-title" placeholder="Enter item title..." />
        </div>
        <div class="form-group">
          <label for="form-description">Description</label>
          <textarea class="form-textarea" id="form-description" placeholder="Enter description..." rows="3"></textarea>
        </div>
        <div class="form-group">
          <label for="form-status">Status</label>
          <select class="form-select" id="form-status">
            <option value="active">Active</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn-submit" id="btn-submit">Create</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-glow"></div>
    <div class="container">
      <div class="footer-bottom" style="border-top:none;padding-top:0">
        <p>&copy; <script>document.write(new Date().getFullYear())</script> Acme Inc. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script>
    // State
    let items = [];

    // DOM refs
    const grid = document.getElementById('items-grid');
    const emptyState = document.getElementById('empty-state');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalError = document.getElementById('modal-error');
    const formId = document.getElementById('form-id');
    const formTitle = document.getElementById('form-title');
    const formDescription = document.getElementById('form-description');
    const formStatus = document.getElementById('form-status');
    const btnSubmit = document.getElementById('btn-submit');

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function updateStats() {
      const total = items.length;
      const active = items.filter(i => i.status === 'active').length;
      const completed = items.filter(i => i.status === 'completed').length;
      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-active').textContent = active;
      document.getElementById('stat-completed').textContent = completed;
      document.getElementById('item-count-badge').textContent = total + ' items';
    }

    function createCardHtml(item) {
      const statusClass = item.status === 'active' ? 'active' : 'completed';
      const descHtml = item.description
        ? '<p class="item-description">' + escapeHtml(item.description) + '</p>'
        : '';
      return '<div class="item-card glass" data-id="' + item.id + '">' +
        '<div class="item-card-header">' +
          '<h3>' + escapeHtml(item.title) + '</h3>' +
          '<button class="status-badge ' + statusClass + '" onclick="toggleStatus(' + item.id + ')">' + item.status + '</button>' +
        '</div>' +
        descHtml +
        '<div class="item-card-footer">' +
          '<span class="item-date">' + formatDate(item.created_at) + '</span>' +
          '<div class="item-actions">' +
            '<button class="icon-btn" title="Edit" onclick="openEditModal(' + item.id + ')">' +
              '<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>' +
            '</button>' +
            '<button class="icon-btn delete" title="Delete" onclick="deleteItem(' + item.id + ')">' +
              '<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>' +
            '</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderItems() {
      if (items.length === 0) {
        grid.innerHTML = '';
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
        grid.innerHTML = items.map(createCardHtml).join('');
      }
      updateStats();
    }

    async function loadItems() {
      try {
        const res = await fetch('/api/items');
        items = await res.json();
        renderItems();
      } catch (err) {
        console.error('Failed to load items:', err);
      }
    }

    function openModal(item) {
      if (item) {
        modalTitle.textContent = 'Edit Item';
        btnSubmit.textContent = 'Update';
        formId.value = item.id;
        formTitle.value = item.title;
        formDescription.value = item.description;
        formStatus.value = item.status;
      } else {
        modalTitle.textContent = 'New Item';
        btnSubmit.textContent = 'Create';
        formId.value = '';
        formTitle.value = '';
        formDescription.value = '';
        formStatus.value = 'active';
      }
      modalError.classList.remove('show');
      modal.classList.add('open');
      formTitle.focus();
    }

    function openEditModal(id) {
      const item = items.find(i => i.id === id);
      if (item) openModal(item);
    }

    function closeModal() {
      modal.classList.remove('open');
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const title = formTitle.value.trim();
      if (!title) {
        modalError.textContent = 'Title is required';
        modalError.classList.add('show');
        return;
      }

      const id = formId.value;
      const payload = {
        title: title,
        description: formDescription.value.trim(),
        status: formStatus.value,
      };

      btnSubmit.disabled = true;
      try {
        if (id) {
          const res = await fetch('/api/items/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const updated = await res.json();
          items = items.map(i => i.id === updated.id ? updated : i);
        } else {
          const res = await fetch('/api/items', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const created = await res.json();
          items = [created, ...items];
        }
        renderItems();
        closeModal();
      } catch (err) {
        modalError.textContent = 'Something went wrong';
        modalError.classList.add('show');
      } finally {
        btnSubmit.disabled = false;
      }
    }

    async function deleteItem(id) {
      if (!confirm('Are you sure you want to delete this item?')) return;
      try {
        await fetch('/api/items/' + id, { method: 'DELETE' });
        items = items.filter(i => i.id !== id);
        renderItems();
      } catch (err) {
        console.error('Delete failed:', err);
      }
    }

    async function toggleStatus(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      const newStatus = item.status === 'active' ? 'completed' : 'active';
      try {
        const res = await fetch('/api/items/' + id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus }),
        });
        const updated = await res.json();
        items = items.map(i => i.id === updated.id ? updated : i);
        renderItems();
      } catch (err) {
        console.error('Status update failed:', err);
      }
    }

    // Navbar scroll effect
    window.addEventListener('scroll', () => {
      const navbar = document.querySelector('.navbar');
      if (window.scrollY > 50) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });

    // Mobile menu
    const mobileToggle = document.querySelector('.mobile-toggle');
    const mobileMenu = document.querySelector('.mobile-menu');
    if (mobileToggle && mobileMenu) {
      mobileToggle.addEventListener('click', () => {
        mobileMenu.classList.toggle('open');
      });
    }

    // Init
    loadItems();
  </script>
</body>
</html>
