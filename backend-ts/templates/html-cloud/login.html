<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 28rem;
      padding: 2rem;
      border-radius: 1rem;
    }
    .auth-title {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      color: white;
      margin-bottom: 0.5rem;
    }
    .auth-subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 2rem;
    }
    .auth-error {
      display: none;
      margin-bottom: 1rem;
      padding: 0.75rem;
      border-radius: 0.5rem;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #f87171;
      font-size: 0.875rem;
    }
    .auth-error.show { display: block; }
    .auth-form .form-group {
      margin-bottom: 1rem;
    }
    .auth-form label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 0.375rem;
    }
    .auth-form input {
      width: 100%;
      padding: 0.625rem 1rem;
      border-radius: 0.5rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      font-family: inherit;
      font-size: 0.9375rem;
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .auth-form input::placeholder { color: rgba(148, 163, 184, 0.5); }
    .auth-form input:focus {
      border-color: rgba(139, 92, 246, 0.5);
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.15);
    }
    .auth-btn {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.9375rem;
      cursor: pointer;
      transition: all 0.3s;
      border: none;
      color: white;
      background: linear-gradient(135deg, var(--purple-600, #9333ea), var(--indigo-600, #4f46e5));
      margin-top: 0.5rem;
    }
    .auth-btn:hover {
      background: linear-gradient(135deg, var(--purple-500, #a855f7), var(--indigo-500, #6366f1));
    }
    .auth-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: #94a3b8;
      font-size: 0.875rem;
    }
    .auth-footer a {
      color: #818cf8;
      font-weight: 500;
      text-decoration: none;
    }
    .auth-footer a:hover { color: #a5b4fc; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card glass">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your account</p>

      <div class="auth-error" id="auth-error"></div>

      <form class="auth-form" id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required />
        </div>
        <button type="submit" class="auth-btn" id="submit-btn">Sign in</button>
      </form>

      <p class="auth-footer">
        Don't have an account? <a href="register.html">Sign up</a>
      </p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // Redirect if already logged in
    Auth.redirectIfAuth();

    async function handleLogin(e) {
      e.preventDefault();
      const errorEl = document.getElementById('auth-error');
      const btn = document.getElementById('submit-btn');

      errorEl.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        await Auth.signIn({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message || 'Invalid email or password';
        errorEl.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    }
  </script>
</body>
</html>
