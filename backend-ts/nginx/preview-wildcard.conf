# Wildcard preview: {projectId}.drape.info → backend resolves → container:3000
#
# Nginx proxies to the Express backend which handles:
# 1. Token validation
# 2. Container resolution
# 3. Direct proxy to container (no HTML injection, no decompression)
#
# This is simpler and more robust than auth_request + dynamic upstream.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # Match ALL subdomains except known ones (www, dev, api)
    server_name ~^(?!www\.|dev\.|api\.)([a-z0-9][a-z0-9-]+)\.drape\.info$;

    ssl_certificate /etc/letsencrypt/live/drape.info-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drape.info-wildcard/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Let backend handle everything — it resolves the container and proxies directly
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        client_max_body_size 100M;
    }
}

# HTTP → HTTPS redirect for wildcard subdomains
server {
    listen 80;
    server_name *.drape.info;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
